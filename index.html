<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harry Bougard Tools - Target Curve Lab</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="app">

<header>
    <div>
        <h1>Harry Bougard Tools</h1>
        <p>Target Curve Lab</p>
    </div>
</header>

<div class="layout">

    <section class="panel controls">

        <h2>Curva objetivo</h2>

        <select id="presetSelect">
            <option>L-Acoustics Contour</option>
            <option>Flat</option>
            <option>Techno</option>
            <option>Darkwave</option>
            <option>Post-Punk</option>
            <option>Synthwave</option>
        </select>

        <button id="loadPreset">
            Cargar curva
        </button>

        <button id="generateNoise">
            Generar ruido
        </button>

        <button id="downloadWav">
            Exportar WAV
        </button>

        <button id="downloadTxt">
            Exportar TXT
        </button>

        <h2>Puntos</h2>

        <textarea id="curveData"></textarea>

    </section>

    <section class="panel graph">

        <canvas id="curveChart"></canvas>

    </section>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
